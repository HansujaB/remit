services:
  falkordb:
    image: falkordb/falkordb:v4.20.4
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - remit-graph:/data
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --save 60 1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  remit-graph:
